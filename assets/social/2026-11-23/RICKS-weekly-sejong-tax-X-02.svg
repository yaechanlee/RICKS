<text x="78" y="190" fill="#0b2a43" font-family="Arial,sans-serif" font-size="49" font-weight="700">Two meanings of fairness</text>
<rect x="32" y="320" width="1016" height="592" fill="#f3efe7"/>
<text x="78" y="386" fill="#0b2a43" font-family="Arial,sans-serif" font-size="31" font-weight="700">THE PROBLEM</text>
<text x="78" y="432" fill="#293944" font-family="Arial,sans-serif" font-size="29">Harvest inspections could reflect farmers’ losses,</text>
<text x="78" y="471" fill="#293944" font-family="Arial,sans-serif" font-size="29">but assessors’ discretion also enabled abuse.</text>
<text x="78" y="540" fill="#0b2a43" font-family="Arial,sans-serif" font-size="31" font-weight="700">THE DIVIDE</text>
<text x="78" y="586" fill="#293944" font-family="Arial,sans-serif" font-size="29">Reformers valued certainty in tax collection.</text>
<text x="78" y="625" fill="#293944" font-family="Arial,sans-serif" font-size="29">Opponents stressed farmers’ ability to pay.</text>
<text x="78" y="694" fill="#0b2a43" font-family="Arial,sans-serif" font-size="31" font-weight="700">THE EVIDENCE</text>
<text x="78" y="740" fill="#293944" font-family="Arial,sans-serif" font-size="29">Kim reads rival interpretations of Mencius and</text>
<text x="78" y="779" fill="#293944" font-family="Arial,sans-serif" font-size="29">the policy debate through the ACF framework.</text>
<text x="78" y="875" fill="#476071" font-family="Arial,sans-serif" font-size="20">Kim Jun-tae · 2015 · Sejong’s Gongbeop reform</text>
